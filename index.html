<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Cidade 3D</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #87ceeb;

    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}


/* =========================
   LOADING
========================= */

#loading {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #111;

    color: white;

    font-size: 22px;
}


/* =========================
   MENU
========================= */

#menu {

    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            rgba(0,0,0,.55),
            rgba(0,0,0,.8)
        );

    color: white;

    text-align: center;

    cursor: pointer;
}

.menuBox {

    width: min(90%, 500px);

    padding: 35px;

    border-radius: 20px;

    background: rgba(20,20,25,.95);

    box-shadow:
        0 20px 80px rgba(0,0,0,.6);
}

.menuBox h1 {

    margin-top: 0;

    font-size: 40px;
}

.menuBox p {

    color: #bbb;

    line-height: 1.6;
}

button {

    border: none;

    border-radius: 10px;

    padding: 15px 30px;

    background: white;

    color: black;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}


/* =========================
   HUD
========================= */

#hud {

    position: fixed;

    top: 15px;
    left: 15px;

    z-index: 50;

    padding: 12px 15px;

    border-radius: 10px;

    background: rgba(0,0,0,.5);

    color: white;

    font-size: 13px;

    pointer-events: none;
}

#hud strong {

    font-size: 17px;
}


/* =========================
   MIRA
========================= */

#crosshair {

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 20;

    color: white;

    font-size: 22px;

    text-shadow:
        0 0 5px black;

    pointer-events: none;
}


/* =========================
   LOCAL
========================= */

#location {

    position: fixed;

    bottom: 15px;
    left: 50%;

    transform:
        translateX(-50%);

    z-index: 20;

    padding: 8px 15px;

    border-radius: 20px;

    background: rgba(0,0,0,.45);

    color: white;

    font-size: 13px;

    pointer-events: none;
}


/* =========================
   MOBILE
========================= */

#mobile {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 100;

    pointer-events: none;
}

.mobileButton {

    position: absolute;

    width: 60px;
    height: 60px;

    border-radius: 50%;

    background:
        rgba(0,0,0,.4);

    border:
        1px solid
        rgba(255,255,255,.3);

    color: white;

    font-size: 22px;

    pointer-events: auto;

    touch-action: none;
}

#up {

    left: 80px;
    bottom: 130px;
}

#down {

    left: 80px;
    bottom: 20px;
}

#left {

    left: 15px;
    bottom: 75px;
}

#right {

    left: 145px;
    bottom: 75px;
}


/* =========================
   ERRO
========================= */

#error {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 10000;

    padding: 25px;

    overflow: auto;

    background: #111;

    color: white;
}

#error h2 {

    color: #ff5555;
}

#error pre {

    white-space: pre-wrap;

    color: #ccc;
}


@media(max-width:700px) {

    #mobile {
        display: block;
    }

    #hud {

        font-size: 11px;

    }

    #hud strong {

        font-size: 14px;

    }

    .menuBox h1 {

        font-size: 30px;

    }

}

</style>

</head>


<body>


<!-- =========================
     LOADING
========================= -->

<div id="loading">

    Construindo cidade...

</div>


<!-- =========================
     MENU
========================= -->

<div id="menu">

    <div class="menuBox">

        <h1>🏙️ CIDADE 3D</h1>

        <p>
            Explore uma pequena cidade
            em primeira pessoa.
        </p>

        <p>
            <b>W A S D</b> para andar<br>
            <b>Mouse</b> para olhar
        </p>

        <button id="startButton">

            ENTRAR NA CIDADE

        </button>

    </div>

</div>


<!-- =========================
     HUD
========================= -->

<div id="hud">

    <strong>🏙️ Cidade 3D</strong>

    <br>

    WASD — andar

    <br>

    Mouse — olhar

</div>


<div id="crosshair">

    +

</div>


<div id="location">

    Distrito Central

</div>


<!-- =========================
     MOBILE
========================= -->

<div id="mobile">

    <button
        class="mobileButton"
        id="up"
    >
        ▲
    </button>

    <button
        class="mobileButton"
        id="down"
    >
        ▼
    </button>

    <button
        class="mobileButton"
        id="left"
    >
        ◀
    </button>

    <button
        class="mobileButton"
        id="right"
    >
        ▶
    </button>

</div>


<!-- =========================
     ERRO
========================= -->

<div id="error">

    <h2>
        ⚠️ Erro
    </h2>

    <p>
        O jogo não conseguiu iniciar.
    </p>

    <pre id="errorText"></pre>

</div>


<!-- =========================================================
     THREE.JS
     
     IMPORTANTE:
     NÃO É MODULE.
     NÃO TEM IMPORTMAP.
     NÃO TEM PointerLockControls.
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>


<script>

/* =========================================================
   VERIFICAR THREE.JS
========================================================= */

if (
    typeof THREE === "undefined"
) {

    document.getElementById(
        "loading"
    ).style.display = "none";

    document.getElementById(
        "error"
    ).style.display = "block";

    document.getElementById(
        "errorText"
    ).textContent =
        "Three.js não carregou.\n\n" +
        "Verifique sua conexão com a internet.";

    throw new Error(
        "Three.js não carregou."
    );

}


/* =========================================================
   ELEMENTOS
========================================================= */

const loading =
    document.getElementById(
        "loading"
    );

const menu =
    document.getElementById(
        "menu"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const error =
    document.getElementById(
        "error"
    );

const errorText =
    document.getElementById(
        "errorText"
    );


/* =========================================================
   CENA
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x87ceeb
    );

scene.fog =
    new THREE.Fog(
        0x87ceeb,
        100,
        500
    );


/* =========================================================
   CÂMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(

        75,

        window.innerWidth /
        window.innerHeight,

        0.1,

        1000

    );


camera.position.set(
    0,
    2,
    20
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias: true

    });


renderer.setSize(

    window.innerWidth,

    window.innerHeight

);


renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio || 1,
        2
    )

);


renderer.shadowMap.enabled =
    true;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LUZ
========================================================= */

const ambient =
    new THREE.HemisphereLight(

        0xffffff,

        0x445544,

        2

    );


scene.add(
    ambient
);


const sun =
    new THREE.DirectionalLight(

        0xffffff,

        3

    );


sun.position.set(
    100,
    200,
    100
);


sun.castShadow =
    true;


scene.add(
    sun
);


/* =========================================================
   MATERIAIS
========================================================= */

const grassMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x4f8a45

    });


const roadMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x292929

    });


const sidewalkMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x999999

    });


const lineMaterial =
    new THREE.MeshBasicMaterial({

        color: 0xf0d34f

    });


const windowMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x6fa8c7

    });


/* =========================================================
   FUNÇÃO CUBO
========================================================= */

function cube(
    width,
    height,
    depth,
    material,
    x,
    y,
    z
) {

    const geometry =
        new THREE.BoxGeometry(

            width,
            height,
            depth

        );


    const object =
        new THREE.Mesh(

            geometry,

            material

        );


    object.position.set(
        x,
        y,
        z
    );


    object.castShadow =
        true;


    object.receiveShadow =
        true;


    scene.add(
        object
    );


    return object;

}


/* =========================================================
   CHÃO
========================================================= */

cube(

    1000,
    .2,
    1000,

    grassMaterial,

    0,
    -.1,
    0

);


/* =========================================================
   RUAS
========================================================= */

const CITY = 250;

const SPACING = 50;

const ROAD = 14;


for (
    let i = -250;
    i <= 250;
    i += SPACING
) {


    /* RUA HORIZONTAL */

    cube(

        CITY * 2,
        .1,
        ROAD,

        roadMaterial,

        0,
        .05,
        i

    );


    /* CALÇADAS */

    cube(

        CITY * 2,
        .2,
        3,

        sidewalkMaterial,

        0,
        .1,
        i - 9

    );


    cube(

        CITY * 2,
        .2,
        3,

        sidewalkMaterial,

        0,
        .1,
        i + 9

    );


    /* RUA VERTICAL */

    cube(

        ROAD,
        .1,
        CITY * 2,

        roadMaterial,

        i,
        .05,
        0

    );


    /* CALÇADAS */

    cube(

        3,
        .2,
        CITY * 2,

        sidewalkMaterial,

        i - 9,
        .1,
        0

    );


    cube(

        3,
        .2,
        CITY * 2,

        sidewalkMaterial,

        i + 9,
        .1,
        0

    );

}


/* =========================================================
   LINHAS DAS RUAS
========================================================= */

for (
    let i = -250;
    i <= 250;
    i += 50
) {

    for (
        let p = -240;
        p < 240;
        p += 14
    ) {


        cube(

            6,
            .03,
            .25,

            lineMaterial,

            p,
            .12,
            i

        );


        cube(

            .25,
            .03,
            6,

            lineMaterial,

            i,
            .12,
            p

        );

    }

}


/* =========================================================
   PRÉDIOS
========================================================= */

const buildingColors = [

    0xb8b8b8,
    0xaaa092,
    0x8999a8,
    0xc5b28f,
    0x8f8f8f,
    0xbdb5aa,
    0x777f87,
    0xd0c2aa

];


function building(
    x,
    z
) {


    const width =
        12 +
        Math.random() * 10;


    const depth =
        12 +
        Math.random() * 10;


    const height =
        8 +
        Math.random() * 35;


    const color =
        buildingColors[
            Math.floor(
                Math.random() *
                buildingColors.length
            )
        ];


    const material =
        new THREE.MeshStandardMaterial({

            color: color

        });


    cube(

        width,
        height,
        depth,

        material,

        x,
        height / 2,
        z

    );


    /* JANELAS */

    const floors =
        Math.floor(
            height / 4
        );


    for (
        let floor = 0;
        floor < floors;
        floor++
    ) {


        for (
            let w = 0;
            w < 3;
            w++
        ) {


            const wx =
                x -
                width / 2 +
                3 +
                w * 3.5;


            const window =
                cube(

                    1.5,
                    1.5,
                    .08,

                    windowMaterial,

                    wx,

                    2 +
                    floor * 4,

                    z +
                    depth / 2 +
                    .05

                );


        }

    }

}


/* =========================================================
   DISTRIBUIR PRÉDIOS
========================================================= */

for (
    let x = -225;
    x <= 225;
    x += 50
) {


    for (
        let z = -225;
        z <= 225;
        z += 50
    ) {


        const bx =
            x + 25;

        const bz =
            z + 25;


        /*
         * Dois prédios por quarteirão.
         */

        building(

            bx - 7,
            bz - 7

        );


        if (
            Math.random() > .35
        ) {

            building(

                bx + 8,
                bz + 8

            );

        }

    }

}


/* =========================================================
   ÁRVORES
========================================================= */

function tree(
    x,
    z
) {


    const trunkMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x5b3824

        });


    const leavesMaterial =
        new THREE.MeshStandardMaterial({

            color: 0x2f7138

        });


    cube(

        .6,
        4,
        .6,

        trunkMaterial,

        x,
        2,
        z

    );


    const leaves =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                2.5,
                10,
                10
            ),

            leavesMaterial

        );


    leaves.position.set(

        x,
        5,
        z

    );


    leaves.castShadow =
        true;


    scene.add(
        leaves
    );

}


/* =========================================================
   ÁRVORES ALEATÓRIAS
========================================================= */

for (
    let i = 0;
    i < 120;
    i++
) {


    const x =
        Math.random() *
        480 -
        240;


    const z =
        Math.random() *
        480 -
        240;


    /*
     * Evitar o centro das ruas.
     */

    if (
        Math.abs(
            x % 50
        ) > 12 &&

        Math.abs(
            z % 50
        ) > 12
    ) {

        tree(
            x,
            z
        );

    }

}


/* =========================================================
   CONTROLES
========================================================= */

const keys = {

    w: false,
    a: false,
    s: false,
    d: false

};


window.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code ===
            "KeyW"
        )
            keys.w = true;


        if (
            event.code ===
            "KeyA"
        )
            keys.a = true;


        if (
            event.code ===
            "KeyS"
        )
            keys.s = true;


        if (
            event.code ===
            "KeyD"
        )
            keys.d = true;

    }
);


window.addEventListener(
    "keyup",
    function(event) {

        if (
            event.code ===
            "KeyW"
        )
            keys.w = false;


        if (
            event.code ===
            "KeyA"
        )
            keys.a = false;


        if (
            event.code ===
            "KeyS"
        )
            keys.s = false;


        if (
            event.code ===
            "KeyD"
        )
            keys.d = false;

    }
);


/* =========================================================
   CÂMERA / MOUSE
========================================================= */

let yaw = 0;

let pitch = 0;

let mouseLocked = false;


function updateCameraRotation() {

    camera.rotation.order =
        "YXZ";


    camera.rotation.y =
        yaw;


    camera.rotation.x =
        pitch;

}


/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    function(event) {

        if (
            !mouseLocked
        )
            return;


        const sensitivity =
            0.0025;


        yaw -=
            event.movementX *
            sensitivity;


        pitch -=
            event.movementY *
            sensitivity;


        const limit =
            Math.PI / 2 -
            .05;


        pitch =
            Math.max(
                -limit,
                Math.min(
                    limit,
                    pitch
                )
            );


        updateCameraRotation();

    }
);


/* =========================================================
   ENTRAR
========================================================= */

startButton.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();


        mouseLocked =
            true;


        menu.style.display =
            "none";


        if (
            document.body.requestPointerLock
        ) {

            document.body.requestPointerLock();

        }

    }
);


/* =========================================================
   POINTER LOCK
========================================================= */

document.addEventListener(
    "pointerlockchange",
    function() {

        mouseLocked =
            document.pointerLockElement ===
            document.body;


        if (
            !mouseLocked
        ) {

            menu.style.display =
                "flex";

        }

    }
);


/* =========================================================
   CLICAR NO JOGO
========================================================= */

renderer.domElement.addEventListener(
    "click",
    function() {

        if (
            !mouseLocked
        ) {

            if (
                document.body.requestPointerLock
            ) {

                document.body.requestPointerLock();

            }

            mouseLocked =
                true;

            menu.style.display =
                "none";

        }

    }
);


/* =========================================================
   MOVIMENTAÇÃO
========================================================= */

const velocity =
    new THREE.Vector3();


const direction =
    new THREE.Vector3();


function movePlayer(
    delta
) {


    direction.set(
        0,
        0,
        0
    );


    if (keys.w)
        direction.z -= 1;


    if (keys.s)
        direction.z += 1;


    if (keys.a)
        direction.x -= 1;


    if (keys.d)
        direction.x += 1;


    if (
        direction.length() > 0
    ) {

        direction.normalize();


        const speed =
            18;


        const forward =
            new THREE.Vector3(
                0,
                0,
                -1
            );


        forward.applyQuaternion(
            camera.quaternion
        );


        forward.y = 0;

        forward.normalize();


        const right =
            new THREE.Vector3(
                1,
                0,
                0
            );


        right.applyQuaternion(
            camera.quaternion
        );


        right.y = 0;

        right.normalize();


        velocity.set(
            0,
            0,
            0
        );


        velocity.addScaledVector(
            forward,
            -direction.z *
            speed *
            delta
        );


        velocity.addScaledVector(
            right,
            direction.x *
            speed *
            delta
        );


        camera.position.add(
            velocity
        );

    }


    camera.position.y =
        2;


    /* LIMITES */

    camera.position.x =
        Math.max(
            -245,
            Math.min(
                245,
                camera.position.x
            )
        );


    camera.position.z =
        Math.max(
            -245,
            Math.min(
                245,
                camera.position.z
            )
        );

}


/* =========================================================
   LOCALIZAÇÃO
========================================================= */

function updateLocation() {

    const x =
        camera.position.x;


    const z =
        camera.position.z;


    let text =
        "Distrito Central";


    if (
        x > 40
    )
        text =
            "Distrito Leste";


    else if (
        x < -40
    )
        text =
            "Distrito Oeste";


    else if (
        z > 40
    )
        text =
            "Distrito Sul";


    else if (
        z < -40
    )
        text =
            "Distrito Norte";


    document.getElementById(
        "location"
    ).textContent =
        text;

}


/* =========================================================
   MOBILE
========================================================= */

function mobileControl(
    id,
    key
) {

    const button =
        document.getElementById(
            id
        );


    button.addEventListener(
        "touchstart",
        function(event) {

            event.preventDefault();

            keys[key] =
                true;

        },
        {
            passive: false
        }
    );


    button.addEventListener(
        "touchend",
        function(event) {

            event.preventDefault();

            keys[key] =
                false;

        },
        {
            passive: false
        }
    );

}


mobileControl(
    "up",
    "w"
);


mobileControl(
    "down",
    "s"
);


mobileControl(
    "left",
    "a"
);


mobileControl(
    "right",
    "d"
);


/* =========================================================
   LOOP
========================================================= */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    if (
        mouseLocked
    ) {

        movePlayer(
            delta
        );


        updateLocation();

    }


    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }
);


/* =========================================================
   INICIAR
========================================================= */

try {

    loading.style.display =
        "none";


    menu.style.display =
        "flex";


    animate();

}
catch (e) {

    console.error(e);


    loading.style.display =
        "none";


    error.style.display =
        "block";


    errorText.textContent =
        e.stack ||
        e.message ||
        String(e);

}

</script>

</body>

</html>
